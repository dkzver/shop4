<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🛒 Магазин</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .hero-section {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 80px 0;
            border-radius: 0 0 50px 50px;
        }
        .feature-card {
            transition: transform 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .feature-icon {
            font-size: 2.5rem;
            color: #667eea;
        }
        .status-badge {
            background: #00b894;
            color: white;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
        }
        .product-card {
            transition: all 0.3s ease;
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .product-icon {
            font-size: 3rem;
        }
        .product-card .badge {
            font-size: 0.8rem;
            padding: 5px 10px;
        }
        .btn-outline-primary:hover {
            background: #667eea;
            color: white;
        }
        .section-title {
            position: relative;
            margin-bottom: 40px;
        }
        .section-title::after {
            content: '';
            display: block;
            width: 80px;
            height: 4px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 10px auto 0;
            border-radius: 2px;
        }
        .product-card .card-body {
            position: relative;
            z-index: 1;
        }
        .badge {
            z-index: 2;
        }
    </style>
</head>
<body>

<!-- MENU -->

<!-- Hero секция -->
<section class="hero-section text-center">
    <div class="container">
        <h1 class="display-1 fw-bold">
            <i class="bi bi-bag-heart"></i> Привет, покупатель!
        </h1>
        <p class="lead fs-3 mt-3">Добро пожаловать в наш магазин</p>
        <span class="status-badge mt-3 d-inline-block">
            <i class="bi bi-check-circle"></i> Магазин работает
        </span>
        <p class="mt-3">
            <span id="currentTime" class="fs-5"></span>
        </p>
    </div>
</section>

<!-- Карточки преимуществ -->
<div class="container mt-5">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card feature-card text-center p-4 h-100">
                <div class="card-body">
                    <div class="feature-icon mb-3">
                        <i class="bi bi-truck"></i>
                    </div>
                    <h5 class="card-title">Быстрая доставка</h5>
                    <p class="card-text text-muted">Доставляем заказы за 1-2 дня по всей стране</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card feature-card text-center p-4 h-100">
                <div class="card-body">
                    <div class="feature-icon mb-3">
                        <i class="bi bi-shield-check"></i>
                    </div>
                    <h5 class="card-title">Гарантия качества</h5>
                    <p class="card-text text-muted">Все товары проходят проверку качества</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card feature-card text-center p-4 h-100">
                <div class="card-body">
                    <div class="feature-icon mb-3">
                        <i class="bi bi-headset"></i>
                    </div>
                    <h5 class="card-title">Поддержка 24/7</h5>
                    <p class="card-text text-muted">Наша команда всегда готова помочь вам</p>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Блок товаров -->
<div class="container mt-5">
    <h2 class="text-center section-title">
        <i class="bi bi-gift"></i> Популярные товары
    </h2>
    <!-- PRODUCTS -->
</div>

<!-- FOOTER -->

<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('currentTime').textContent = '🕐 ' + new Date().toLocaleString();
    setInterval(() => {
        document.getElementById('currentTime').textContent = '🕐 ' + new Date().toLocaleString();
    }, 1000);

    function addToCart(productId) {
        alert('🛒 Товар добавлен в корзину (ID: ' + productId + ')');
    }
</script>
</body>
</html>
