<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход - Магазин</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .auth-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 0;
        }
        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }
        .auth-card h2 {
            color: #2d3436;
            font-weight: 700;
        }
        .auth-card .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #dfe6e9;
            transition: all 0.3s ease;
        }
        .auth-card .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .auth-card .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .auth-card .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.4);
        }
        .auth-card .btn-outline-secondary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .auth-card .btn-outline-secondary:hover {
            background: #f8f9fa;
        }
        .auth-card a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-card a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 2px solid #dfe6e9;
        }
        .auth-divider span {
            padding: 0 15px;
            color: #b2bec3;
            font-size: 0.9rem;
        }
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>

<!-- MENU -->

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <i class="bi bi-box-arrow-in-right display-2 text-primary"></i>
                        <h2 class="mt-2">Вход в аккаунт</h2>
                        <p class="text-muted">Войдите в свой аккаунт</p>
                    </div>

                    <div id="loginError" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle"></i> <span id="errorMessage">Неверный email или пароль</span>
                    </div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-envelope"></i> Email
                            </label>
                            <input type="email" class="form-control" id="loginEmail" placeholder="ivan@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-lock"></i> Пароль
                            </label>
                            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Войти
                        </button>
                    </form>

                    <div class="auth-divider">
                        <span>или</span>
                    </div>

                    <div class="text-center">
                        <p class="text-muted">Нет аккаунта?</p>
                        <a href="/register" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-person-plus"></i> Зарегистрироваться
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->

<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    // Обработка формы входа
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        const errorDiv = document.getElementById('loginError');
        const errorMessage = document.getElementById('errorMessage');

        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
                // Сохраняем токен
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/profile';
            } else {
                errorMessage.textContent = data.message || 'Ошибка входа';
                errorDiv.classList.remove('d-none');
            }
        } catch (error) {
            errorMessage.textContent = 'Ошибка соединения с сервером';
            errorDiv.classList.remove('d-none');
        }
    });

    // Проверяем, если уже авторизован - перенаправляем в профиль
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = '/profile';
        }
    });
</script>
</body>
</html>
