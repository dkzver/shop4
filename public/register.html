<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - Магазин</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .auth-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 0;
        }
        .auth-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
        }
        .auth-card h2 {
            color: #2d3436;
            font-weight: 700;
        }
        .auth-card .form-control {
            border-radius: 10px;
            padding: 12px 15px;
            border: 2px solid #dfe6e9;
            transition: all 0.3s ease;
        }
        .auth-card .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .auth-card .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .auth-card .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(118, 75, 162, 0.4);
        }
        .auth-card .btn-outline-secondary {
            border-radius: 10px;
            padding: 12px;
            font-weight: 600;
        }
        .auth-card a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }
        .auth-card a:hover {
            color: #764ba2;
            text-decoration: underline;
        }
        .auth-divider {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }
        .auth-divider::before,
        .auth-divider::after {
            content: '';
            flex: 1;
            border-bottom: 2px solid #dfe6e9;
        }
        .auth-divider span {
            padding: 0 15px;
            color: #b2bec3;
            font-size: 0.9rem;
        }
        .alert {
            border-radius: 10px;
        }
        .password-strength {
            height: 5px;
            border-radius: 5px;
            margin-top: 5px;
            transition: all 0.3s ease;
        }
        .password-strength.weak { background: #dc3545; width: 33%; }
        .password-strength.medium { background: #ffc107; width: 66%; }
        .password-strength.strong { background: #28a745; width: 100%; }
    </style>
</head>
<body>

<!-- MENU -->

<section class="auth-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="auth-card">
                    <div class="text-center mb-4">
                        <i class="bi bi-person-plus display-2 text-primary"></i>
                        <h2 class="mt-2">Регистрация</h2>
                        <p class="text-muted">Создайте новый аккаунт</p>
                    </div>

                    <div id="registerError" class="alert alert-danger d-none" role="alert">
                        <i class="bi bi-exclamation-triangle"></i> <span id="errorMessage">Ошибка регистрации</span>
                    </div>

                    <div id="registerSuccess" class="alert alert-success d-none" role="alert">
                        <i class="bi bi-check-circle"></i> <span>Регистрация успешна! Перенаправление...</span>
                    </div>

                    <form id="registerForm">
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-person"></i> Имя
                            </label>
                            <input type="text" class="form-control" id="registerName" placeholder="Иван Иванов" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-envelope"></i> Email
                            </label>
                            <input type="email" class="form-control" id="registerEmail" placeholder="ivan@example.com" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-lock"></i> Пароль
                            </label>
                            <input type="password" class="form-control" id="registerPassword" placeholder="••••••••" required minlength="6">
                            <div class="password-strength" id="passwordStrength"></div>
                            <small class="text-muted">Минимум 6 символов</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                <i class="bi bi-lock-fill"></i> Подтвердите пароль
                            </label>
                            <input type="password" class="form-control" id="registerConfirmPassword" placeholder="••••••••" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-person-plus"></i> Зарегистрироваться
                        </button>
                    </form>

                    <div class="auth-divider">
                        <span>или</span>
                    </div>

                    <div class="text-center">
                        <p class="text-muted">Уже есть аккаунт?</p>
                        <a href="/login" class="btn btn-outline-secondary w-100">
                            <i class="bi bi-box-arrow-in-right"></i> Войти
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

<!-- FOOTER -->

<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    // Проверка пароля
    document.getElementById('registerPassword').addEventListener('input', function() {
        const password = this.value;
        const strengthDiv = document.getElementById('passwordStrength');

        if (password.length === 0) {
            strengthDiv.className = 'password-strength';
            return;
        }

        if (password.length < 6) {
            strengthDiv.className = 'password-strength weak';
        } else if (password.length < 10) {
            strengthDiv.className = 'password-strength medium';
        } else {
            strengthDiv.className = 'password-strength strong';
        }
    });

    // Обработка формы регистрации
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
        e.preventDefault();

        const name = document.getElementById('registerName').value;
        const email = document.getElementById('registerEmail').value;
        const password = document.getElementById('registerPassword').value;
        const confirmPassword = document.getElementById('registerConfirmPassword').value;

        const errorDiv = document.getElementById('registerError');
        const errorMessage = document.getElementById('errorMessage');
        const successDiv = document.getElementById('registerSuccess');

        // Проверка паролей
        if (password !== confirmPassword) {
            errorMessage.textContent = 'Пароли не совпадают';
            errorDiv.classList.remove('d-none');
            successDiv.classList.add('d-none');
            return;
        }

        if (password.length < 6) {
            errorMessage.textContent = 'Пароль должен быть не менее 6 символов';
            errorDiv.classList.remove('d-none');
            successDiv.classList.add('d-none');
            return;
        }

        try {
            const response = await fetch('/api/auth/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name, email, password })
            });

            const data = await response.json();

            if (data.success) {
                successDiv.classList.remove('d-none');
                errorDiv.classList.add('d-none');

                // Автоматический вход после регистрации
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));

                setTimeout(() => {
                    window.location.href = '/profile';
                }, 1500);
            } else {
                errorMessage.textContent = data.message || 'Ошибка регистрации';
                errorDiv.classList.remove('d-none');
                successDiv.classList.add('d-none');
            }
        } catch (error) {
            errorMessage.textContent = 'Ошибка соединения с сервером';
            errorDiv.classList.remove('d-none');
            successDiv.classList.add('d-none');
        }
    });

    // Проверяем, если уже авторизован - перенаправляем в профиль
    document.addEventListener('DOMContentLoaded', function() {
        const token = localStorage.getItem('token');
        if (token) {
            window.location.href = '/profile';
        }
    });
</script>
</body>
</html>
