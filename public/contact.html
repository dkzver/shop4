<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты - Магазин</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .contact-hero {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 60px 0;
            border-radius: 0 0 50px 50px;
        }
        .contact-card {
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .contact-card:hover {
            transform: translateY(-5px);
        }
        .contact-icon {
            font-size: 2.5rem;
            color: #667eea;
        }
        .contact-form {
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .map-placeholder {
            background: #dfe6e9;
            height: 250px;
            border-radius: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #636e72;
        }
    </style>
</head>
<body>

<!-- MENU -->

<section class="contact-hero text-center">
    <div class="container">
        <h1 class="display-3 fw-bold">
            <i class="bi bi-envelope-fill"></i> Контакты
        </h1>
        <p class="lead fs-4 mt-3">Мы всегда рады помочь вам!</p>
    </div>
</section>

<div class="container mt-5">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card contact-card text-center p-4">
                <div class="contact-icon"><i class="bi bi-geo-alt"></i></div>
                <h5 class="mt-3">Адрес</h5>
                <p class="text-muted">г. Москва, ул. Примерная, д. 1</p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card contact-card text-center p-4">
                <div class="contact-icon"><i class="bi bi-telephone"></i></div>
                <h5 class="mt-3">Телефон</h5>
                <p><strong>+7 (999) 123-45-67</strong></p>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card contact-card text-center p-4">
                <div class="contact-icon"><i class="bi bi-envelope"></i></div>
                <h5 class="mt-3">Email</h5>
                <p><strong>shop@example.com</strong></p>
            </div>
        </div>
    </div>

    <div class="row mt-5">
        <div class="col-md-8 mx-auto">
            <div class="contact-form">
                <h4 class="text-center mb-4"><i class="bi bi-chat-dots"></i> Напишите нам</h4>
                <form>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Ваше имя</label>
                            <input type="text" class="form-control" placeholder="Иван Иванов">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email</label>
                            <input type="email" class="form-control" placeholder="ivan@example.com">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Тема</label>
                        <select class="form-select">
                            <option>Вопрос о товаре</option>
                            <option>Доставка</option>
                            <option>Возврат</option>
                            <option>Сотрудничество</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Сообщение</label>
                        <textarea class="form-control" rows="4" placeholder="Опишите ваш вопрос..."></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-send"></i> Отправить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- FOOTER -->

<script src="/js/bootstrap.bundle.min.js"></script>
</body>
</html>
