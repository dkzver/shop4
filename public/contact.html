<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контакты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        .contact-hero {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            padding: 60px 0;
            border-radius: 0 0 50px 50px;
        }
        .contact-card {
            border: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }
        .contact-card:hover {
            transform: translateY(-5px);
        }
        .contact-icon {
            font-size: 2rem;
            color: #667eea;
        }
    </style>
</head>
<body>

<!-- Навигация -->
<nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
    <div class="container">
        <a class="navbar-brand" href="/">
            <i class="bi bi-shop"></i> Магазин
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="/">
                        <i class="bi bi-house"></i> Главная
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/about">
                        <i class="bi bi-info-circle"></i> О нас
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="/contact">
                        <i class="bi bi-envelope"></i> Контакты
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/health">
                        <i class="bi bi-heart-pulse"></i> Health
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Hero -->
<section class="contact-hero text-center">
    <div class="container">
        <h1 class="display-3 fw-bold">
            <i class="bi bi-envelope-fill"></i> Контакты
        </h1>
        <p class="lead fs-4 mt-3">Мы всегда рады помочь вам!</p>
    </div>
</section>

<!-- Контакты -->
<div class="container mt-5">
    <div class="row g-4">
        <div class="col-md-4">
            <div class="card contact-card text-center p-4 h-100">
                <div class="card-body">
                    <div class="contact-icon">
                        <i class="bi bi-geo-alt"></i>
                    </div>
                    <h5 class="card-title mt-3">Адрес</h5>
                    <p class="card-text text-muted">
                        г. Москва, ул. Примерная, д. 1
                    </p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card contact-card text-center p-4 h-100">
                <div class="card-body">
                    <div class="contact-icon">
                        <i class="bi bi-telephone"></i>
                    </div>
                    <h5 class="card-title mt-3">Телефон</h5>
                    <p class="card-text text-muted">
                        +7 (999) 123-45-67
                    </p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card contact-card text-center p-4 h-100">
                <div class="card-body">
                    <div class="contact-icon">
                        <i class="bi bi-envelope"></i>
                    </div>
                    <h5 class="card-title mt-3">Email</h5>
                    <p class="card-text text-muted">
                        shop@example.com
                    </p>
                </div>
            </div>
        </div>
    </div>

    <!-- Форма связи -->
    <div class="row mt-5">
        <div class="col-md-8 mx-auto">
            <div class="card shadow-sm p-4">
                <h4 class="text-center mb-4">
                    <i class="bi bi-chat-dots"></i> Напишите нам
                </h4>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Ваше имя</label>
                        <input type="text" class="form-control" placeholder="Введите ваше имя">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Введите ваш email">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Сообщение</label>
                        <textarea class="form-control" rows="4" placeholder="Ваше сообщение..."></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="bi bi-send"></i> Отправить
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<br><br>
<div class="text-center">
    <a href="/" class="btn btn-secondary">
        <i class="bi bi-house"></i> Вернуться на главную
    </a>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
