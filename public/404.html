<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .error-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .error-card {
            background: white;
            border-radius: 30px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            text-align: center;
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .error-number {
            font-size: 120px;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .error-icon {
            font-size: 80px;
            color: #764ba2;
        }
        .btn-home {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 40px;
            border-radius: 50px;
            color: white;
            font-weight: 600;
        }
        .btn-home:hover {
            transform: scale(1.05);
            color: white;
        }
        .error-links a {
            color: #667eea;
            text-decoration: none;
            margin: 0 10px;
        }
        .error-links a:hover {
            color: #764ba2;
        }
    </style>
</head>
<body>
<div class="error-section">
    <div class="error-card">
        <i class="bi bi-exclamation-triangle-fill error-icon"></i>
        <div class="error-number">404</div>
        <h1><i class="bi bi-emoji-frown"></i> Страница не найдена</h1>
        <p class="text-muted">Извините, страница не существует или была перемещена.</p>
        <a href="/" class="btn btn-home">
            <i class="bi bi-house"></i> На главную
        </a>
        <div class="error-links mt-3">
            <a href="/about"><i class="bi bi-info-circle"></i> О нас</a>
            <a href="/contact"><i class="bi bi-envelope"></i> Контакты</a>
        </div>
        <div class="mt-4 text-muted small">
            <i class="bi bi-clock"></i> <span id="currentTime"></span>
        </div>
    </div>
</div>

<script src="/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('currentTime').textContent = new Date().toLocaleString();
    setInterval(() => {
        document.getElementById('currentTime').textContent = new Date().toLocaleString();
    }, 1000);
</script>
</body>
</html>
